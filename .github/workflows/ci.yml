name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"   # daily 06:00 UTC: fails when the backend's openapi.json on main no longer matches src/api/api.gen.ts
  workflow_dispatch:       # manual "Run workflow" button

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      # Needs the network: compares src/api/api.gen.ts with what the backend's openapi.json on main generates.
      - run: npm run check:api

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # pull-requests: read lets the action list a PR's commits.
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Full history, so a key committed and later deleted is still found.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
