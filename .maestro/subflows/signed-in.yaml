# Shared setup: signs in (sign-in.yaml) and switches to the faster flash model. Needs MAESTRO_DEMO_USER and
# MAESTRO_DEMO_PASS when it has to sign in.
appId: host.exp.Exponent
---
- runFlow: sign-in.yaml
# The pro model reasons for half a minute before the first word, which makes a long demo; use flash. The header shows the
# current model, and tapping it opens the Provider and model sheet. Skipped when the chat is already on flash.
- runFlow:
    when:
      visible: ".*deepseek-v4-pro.*"
    commands:
      - tapOn: ".*deepseek-v4-pro.*"
      - tapOn: "deepseek-flash"
      # Picking a model may already close the sheet.
      - tapOn:
          text: "Done"
          optional: true
- extendedWaitUntil:
    visible: ".*deepseek-flash.*"
    timeout: 10000
