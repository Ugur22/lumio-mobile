# Visual check: the login screen. Run by scripts/visual-check.sh, which sets SHOT_DIR and MODE (light or dark).
appId: host.exp.Exponent
---
# Clear Expo Go's storage so a server or token saved by an earlier run cannot win over the stub.
- launchApp:
    clearState: true
- runFlow: ../subflows/open-app.yaml
- extendedWaitUntil:
    visible: "Username"
    timeout: 10000
- takeScreenshot: ${SHOT_DIR}/${MODE}-login
