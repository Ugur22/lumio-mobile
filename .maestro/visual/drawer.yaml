# Visual check: the chat drawer, opened from the menu button in the chat header.
appId: host.exp.Exponent
---
- launchApp:
    clearState: true
- clearKeychain
- runFlow: ../subflows/sign-in.yaml
- tapOn: "Chats"
- extendedWaitUntil:
    visible: "Sign out"
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: drawer
